      - name: Remove source maps from artifact
        run: find dist/instamortgage-buyer/browser -name "*.map" -delete

      - name: Upload build artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: instamortgage-buyer-artifact-${{ env.BUILD_NUMBER }}
          path: ${{ github.workspace }}/dist/instamortgage-buyer/browser
