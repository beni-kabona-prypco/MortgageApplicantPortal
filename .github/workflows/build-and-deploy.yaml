  production-deploy-code:
    needs: production-build-code
    uses: Prypco/GithubActionsTemplates/.github/workflows/deploy-static-website-and-cleanup.yaml@v0.3.6
    with:
      sourcePath: 'dist/instamortgage-buyer/browser'
      app_name: 'instamortgage-buyer'
      storageAccountName: 'prodinstamortgagebuyer' # TODO: replace with actual storage account name
    secrets: inherit

  production-cache-purge:
    needs: production-deploy-code
    uses: Prypco/GithubActionsTemplates/.github/workflows/purge-frontdoor.yaml@v0.3.6
    with:
      frontdoorName: 'prypco-prod-cfdp' # TODO: confirm
      frontdoorRG: 'prypco-frontdoor-prod' # TODO: confirm
      endpointName: 'prypco-prod-instamortgage-buyer-prypco-cfde' # TODO: replace with actual endpoint name
      domainName: 'instamortgage-buyer.prypco.com' # TODO: replace with actual prod URL
    secrets: inherit
