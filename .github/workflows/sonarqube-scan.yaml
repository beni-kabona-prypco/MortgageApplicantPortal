name: SonarQube Scan

on:
  workflow_dispatch:
  pull_request:
    branches:
      - dev
  push:
    branches:
      - dev
      - staging
      - production

concurrency:
  group: sonar-${{ github.ref }}
  cancel-in-progress: true

permissions:
  id-token: write
  contents: read
  checks: write
  pull-requests: write

env:
  CI: true

jobs:
  sonarqube-scan:
    name: SonarQube Analysis
    runs-on: self-hosted-aks
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '20'
          cache: 'pnpm'
          registry-url: https://npm.pkg.github.com
          scope: '@prypco'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --prefer-offline
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GH_PACKAGES_PAT }}

      - name: Cache SonarQube scanner
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.sonar/cache
          key: ${{ runner.os }}-sonar-cache

      - name: Install Chrome runtime libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libasound2t64 libatk-bridge2.0-0t64 libatk1.0-0t64 libcairo2 \
            libcups2t64 libdbus-1-3 libexpat1 libgbm1 libglib2.0-0t64 \
            libnspr4 libnss3 libpango-1.0-0 libxcomposite1 libxdamage1 \
            libxfixes3 libxkbcommon0 libxrandr2

      - name: Setup Chrome
        uses: browser-actions/setup-chrome@48ad923757ca74d66703209fe939badbdf80f2f4 # v2.2.0
        id: setup-chrome

      - name: Run tests with coverage
        run: KARMA_PORT="$(( 9900 + GITHUB_RUN_NUMBER % 100 ))" pnpm run test:coverage
        env:
          CHROME_BIN: ${{ steps.setup-chrome.outputs.chrome-path }}

      - name: SonarQube Scan
        uses: SonarSource/sonarqube-scan-action@fd88b7d7ccbaefd23d8f36f73b59db7a3d246602 # v6
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
