<app-page-layout [centered]="true">
  <div class="not-found__card">
    <picture class="not-found__bg-wrap">
      <source media="(min-width: 768px)" srcset="/assets/desktop-background.svg" />
      <img src="/assets/mobile-background.svg" alt="" aria-hidden="true" class="not-found__bg" />
    </picture>

    <div class="not-found__content">
      <div class="not-found__icon" aria-hidden="true"></div>

      <prypco-text
        element="h1"
        variant="heading-bold-md"
        [fontSize]="24"
        [lineHeight]="'1.2'"
        color="white"
        align="center"
        class="not-found__heading"
      >
        Link not found
      </prypco-text>

      <prypco-text
        variant="paragraph-regular-md"
        color="white"
        align="center"
        class="not-found__body"
      >
        This application link doesn't exist or may have expired. Please contact your broker to
        receive a new link.
      </prypco-text>
    </div>
  </div>
</app-page-layout>
